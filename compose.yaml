services:
  cancellation-api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: hotel-cancellation-api:latest
    ports:
      - "8000:8000"
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      PREDICTIONS_DB_PATH: /data/predictions.db
      REPORTS_DIR: /reports
    volumes:
      - api-data:/data
      - ./reports:/reports:ro
    depends_on:
      mlflow:
        condition: service_healthy

  mlflow:
    build:
      context: .
      dockerfile: docker/Dockerfile.mlflow
    image: hotel-cancellation-mlflow:3.18.0
    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --backend-store-uri
      - sqlite:////mlflow/mlflow.db
      - --artifacts-destination
      - /mlflow/artifacts
      - --allowed-hosts
      - localhost,localhost:5000,127.0.0.1,127.0.0.1:5000,mlflow,mlflow:5000
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - mlflow-data:/mlflow
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  prometheus:
    image: prom/prometheus:v3.16.0
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.external-url=http://127.0.0.1:9090/"
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - cancellation-api
      - alertmanager

  alertmanager:
    image: prom/alertmanager:v0.35.0
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./config/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./secrets/telegram_bot_token:/etc/alertmanager/secrets/telegram_bot_token:ro
      - alertmanager-data:/alertmanager

  grafana:
    image: grafana/grafana:13.3.1
    ports:
      - "3000:3000"
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  api-data:
  mlflow-data:
  prometheus-data:
  alertmanager-data:
  grafana-data:
