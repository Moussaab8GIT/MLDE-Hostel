global:
  resolve_timeout: 5m

route:
  receiver: silent
  group_by: [alertname]
  group_wait: 5s
  group_interval: 1m
  repeat_interval: 4h
  routes:
    - receiver: telegram
      matchers:
        - alertname="HotelApiUnavailable"

receivers:
  - name: silent
  - name: telegram
    telegram_configs:
      - bot_token_file: /etc/alertmanager/secrets/telegram_bot_token
        chat_id: 6965052159
        send_resolved: true
        parse_mode: ""
